<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clinic Booking</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --ink: #16191d;
    --muted: #666e7a;
    --line: #e3e6ea;
    --accent: #1f6feb;
    --accent-ink: #ffffff;
    --ok-bg: #e7f6ec;
    --ok-ink: #11643a;
    --ok-line: #b6e0c4;
    --bad-bg: #fdecec;
    --bad-ink: #9b1c1c;
    --bad-line: #f5c6c6;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14171a;
      --card: #1c2024;
      --ink: #e8eaed;
      --muted: #9aa3ad;
      --line: #2c3238;
      --accent: #4c8dff;
      --ok-bg: #16301f;
      --ok-ink: #8fe0ab;
      --ok-line: #27543a;
      --bad-bg: #371d1d;
      --bad-ink: #f5a9a9;
      --bad-line: #5d2b2b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 32px 16px 64px; }
  header { margin-bottom: 24px; }
  h1 { font-size: 24px; margin: 0 0 4px; letter-spacing: -0.01em; }
  header p { margin: 0; color: var(--muted); }
  section {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 20px;
  }
  h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 14px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
  .field { display: flex; flex-direction: column; gap: 5px; flex: 1 1 180px; min-width: 0; }
  label { font-size: 12px; color: var(--muted); }
  input {
    font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; width: 100%;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button {
    font: inherit; font-weight: 500; cursor: pointer;
    background: var(--accent); color: var(--accent-ink);
    border: 1px solid transparent; border-radius: 8px; padding: 9px 16px;
  }
  button.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
  button:disabled { opacity: 0.55; cursor: not-allowed; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { font-size: 12px; color: var(--muted); font-weight: 500; }
  tr:last-child td { border-bottom: none; }
  td.actions { text-align: right; white-space: nowrap; }
  .tag { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid; }
  .tag.free { background: var(--ok-bg); color: var(--ok-ink); border-color: var(--ok-line); }
  .tag.taken { background: var(--bad-bg); color: var(--bad-ink); border-color: var(--bad-line); }
  .tag.past { background: transparent; color: var(--muted); border-color: var(--line); }
  .note { padding: 12px 14px; border-radius: 8px; border: 1px solid; margin-bottom: 14px; }
  .note.ok { background: var(--ok-bg); color: var(--ok-ink); border-color: var(--ok-line); }
  .note.bad { background: var(--bad-bg); color: var(--bad-ink); border-color: var(--bad-line); }
  .note code { font-size: 13px; }
  .muted { color: var(--muted); }
  /* A utility class, so it has to beat the component rules below it. */
  .hide { display: none !important; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
  .pager { display: flex; gap: 10px; align-items: center; margin-top: 14px; }
  @media (max-width: 560px) {
    th.hide-sm, td.hide-sm { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Clinic Booking</h1>
    <p>Pick an open appointment slot, book it, and keep the reference.</p>
  </header>

  <section>
    <h2>Available slots</h2>
    <div class="row" style="margin-bottom:14px">
      <div class="field">
        <label for="filter-provider">Filter by provider</label>
        <input id="filter-provider" placeholder="e.g. Dr Ade" autocomplete="off">
      </div>
      <button class="ghost" id="refresh">Refresh</button>
    </div>
    <div id="slots-msg" class="muted">Loading slots&hellip;</div>
    <table id="slots-table" class="hide">
      <thead>
        <tr>
          <th>Provider</th>
          <th>Starts</th>
          <th class="hide-sm">Ends</th>
          <th>Status</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="slots-body"></tbody>
    </table>
  </section>

  <section id="book-section" class="hide">
    <h2>Book <span id="book-slot-label" class="mono"></span></h2>
    <div id="book-msg"></div>
    <div class="row">
      <div class="field">
        <label for="book-name">Full name</label>
        <input id="book-name" placeholder="Ada Obi" autocomplete="name">
      </div>
      <div class="field">
        <label for="book-email">Email</label>
        <input id="book-email" type="email" placeholder="ada@example.com" autocomplete="email">
      </div>
      <button id="confirm">Confirm booking</button>
      <button class="ghost" id="cancel-booking-form">Back</button>
    </div>
  </section>

  <section>
    <h2>My bookings</h2>
    <div class="row" style="margin-bottom:14px">
      <div class="field">
        <label for="lookup-email">Your email</label>
        <input id="lookup-email" type="email" placeholder="ada@example.com" autocomplete="email">
      </div>
      <button class="ghost" id="lookup">Look up</button>
    </div>
    <div id="mine-msg" class="muted">Enter your email to see your bookings.</div>
    <table id="mine-table" class="hide">
      <thead>
        <tr>
          <th>Reference</th>
          <th class="hide-sm">Slot</th>
          <th>Booked</th>
          <th>Status</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="mine-body"></tbody>
    </table>
    <div class="pager hide" id="mine-pager">
      <button class="ghost" id="more">Load more</button>
      <span class="muted" id="page-note"></span>
    </div>
  </section>

</div>

<script>
(function () {
  "use strict";

  var PAGE_SIZE = 10;
  var selectedSlot = null;
  var nextCursor = null;
  var lookupEmail = "";

  function $(id) { return document.getElementById(id); }

  function fmt(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) { return iso; }
    return d.toLocaleString(undefined, {
      weekday: "short", day: "numeric", month: "short",
      hour: "2-digit", minute: "2-digit"
    });
  }

  function note(target, kind, html) {
    $(target).className = "note " + kind;
    $(target).innerHTML = html;
  }

  function clearNote(target) {
    $(target).className = "";
    $(target).innerHTML = "";
  }

  function esc(value) {
    return String(value == null ? "" : value).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // The page talks to /web/*, which is the same API with the key attached
  // server side, so the browser never holds the credential.
  function call(method, path, body, extraHeaders) {
    var options = { method: method, headers: {} };
    if (body !== undefined) {
      options.headers["Content-Type"] = "application/json";
      options.body = JSON.stringify(body);
    }
    if (extraHeaders) {
      Object.keys(extraHeaders).forEach(function (k) { options.headers[k] = extraHeaders[k]; });
    }
    return fetch("/web" + path, options).then(function (response) {
      return response.json().catch(function () { return {}; }).then(function (data) {
        return { ok: response.ok, status: response.status, data: data, response: response };
      });
    });
  }

  // ---- slots ----------------------------------------------------------- //

  function loadSlots() {
    var provider = $("filter-provider").value.trim();
    var path = "/slots" + (provider ? "?provider=" + encodeURIComponent(provider) : "");
    $("slots-msg").className = "muted";
    $("slots-msg").textContent = "Loading slots…";
    $("slots-table").classList.add("hide");

    return call("GET", path).then(function (result) {
      if (!result.ok) {
        note("slots-msg", "bad", esc(result.data.error || "Could not load slots."));
        return;
      }
      renderSlots(result.data.slots || []);
    }).catch(function () {
      note("slots-msg", "bad", "Could not reach the server.");
    });
  }

  function renderSlots(slots) {
    var body = $("slots-body");
    body.innerHTML = "";
    var now = Date.now();
    var shown = 0;

    slots.forEach(function (slot) {
      var started = new Date(slot.start).getTime() <= now;
      var tag, action;
      if (started) {
        tag = '<span class="tag past">past</span>';
        action = "";
      } else if (slot.available) {
        tag = '<span class="tag free">open</span>';
        action = '<button data-slot="' + esc(slot.id) + '">Book</button>';
      } else {
        tag = '<span class="tag taken">booked</span>';
        action = "";
      }
      var row = document.createElement("tr");
      row.innerHTML =
        "<td>" + esc(slot.provider) + "</td>" +
        "<td>" + esc(fmt(slot.start)) + "</td>" +
        '<td class="hide-sm">' + esc(fmt(slot.end)) + "</td>" +
        "<td>" + tag + "</td>" +
        '<td class="actions">' + action + "</td>";
      body.appendChild(row);
      shown += 1;
    });

    if (!shown) {
      $("slots-msg").className = "muted";
      $("slots-msg").textContent = "No slots to show.";
      $("slots-table").classList.add("hide");
      return;
    }
    clearNote("slots-msg");
    $("slots-table").classList.remove("hide");

    body.querySelectorAll("button[data-slot]").forEach(function (button) {
      button.addEventListener("click", function () {
        var slot = slots.filter(function (s) { return s.id === button.getAttribute("data-slot"); })[0];
        openBookingForm(slot);
      });
    });
  }

  // ---- booking --------------------------------------------------------- //

  function openBookingForm(slot) {
    selectedSlot = slot;
    $("book-slot-label").textContent = slot.provider + " — " + fmt(slot.start);
    clearNote("book-msg");
    $("book-section").classList.remove("hide");
    $("book-section").scrollIntoView({ behavior: "smooth", block: "center" });
    $("book-name").focus();
  }

  function closeBookingForm() {
    selectedSlot = null;
    $("book-section").classList.add("hide");
  }

  // A fresh key per attempt, so a double click or a flaky connection that gets
  // retried cannot produce two bookings.
  function newIdempotencyKey() {
    if (window.crypto && window.crypto.randomUUID) { return window.crypto.randomUUID(); }
    return "k-" + Date.now() + "-" + Math.random().toString(16).slice(2);
  }

  function confirmBooking() {
    if (!selectedSlot) { return; }
    var name = $("book-name").value.trim();
    var email = $("book-email").value.trim();

    if (!name) { note("book-msg", "bad", "Please enter your name."); return; }
    if (!email) { note("book-msg", "bad", "Please enter your email."); return; }

    $("confirm").disabled = true;
    var key = newIdempotencyKey();

    call("POST", "/bookings", { slot_id: selectedSlot.id, name: name, email: email },
         { "Idempotency-Key": key })
      .then(function (result) {
        if (result.status === 201) {
          var b = result.data;
          note("book-msg", "ok",
            "<strong>Booked.</strong> " + esc(b.name) + " — " +
            esc(fmt(selectedSlot.start)) + " with " + esc(selectedSlot.provider) +
            '<br>Your reference: <code class="mono">' + esc(b.id) + "</code>");
          $("book-name").value = "";
          $("book-email").value = "";
          selectedSlot = null;
          loadSlots();
          if (b.email) {
            $("lookup-email").value = b.email;
            loadMine(true);
          }
          return;
        }
        if (result.status === 429) {
          var wait = result.response.headers.get("Retry-After") || "60";
          note("book-msg", "bad",
            "Too many attempts for this email. Try again in " + esc(wait) + " seconds.");
          return;
        }
        if (result.status === 409) {
          note("book-msg", "bad", "Someone just took that slot. Please pick another.");
          loadSlots();
          return;
        }
        note("book-msg", "bad", esc(result.data.error || "That did not work."));
      })
      .catch(function () {
        note("book-msg", "bad", "Could not reach the server.");
      })
      .then(function () {
        $("confirm").disabled = false;
      });
  }

  // ---- my bookings ----------------------------------------------------- //

  function loadMine(reset) {
    var email = $("lookup-email").value.trim();
    if (!email) {
      $("mine-msg").className = "muted";
      $("mine-msg").textContent = "Enter your email to see your bookings.";
      $("mine-table").classList.add("hide");
      $("mine-pager").classList.add("hide");
      return;
    }

    if (reset || email !== lookupEmail) {
      lookupEmail = email;
      nextCursor = null;
      $("mine-body").innerHTML = "";
    }

    var path = "/bookings?email=" + encodeURIComponent(email) + "&limit=" + PAGE_SIZE;
    if (nextCursor) { path += "&cursor=" + encodeURIComponent(nextCursor); }

    $("more").disabled = true;
    call("GET", path).then(function (result) {
      $("more").disabled = false;
      if (!result.ok) {
        note("mine-msg", "bad", esc(result.data.error || "Could not load bookings."));
        return;
      }
      appendMine(result.data.bookings || []);
      nextCursor = result.data.next_cursor;
      $("mine-pager").classList.toggle("hide", !nextCursor);
      var count = $("mine-body").children.length;
      $("page-note").textContent = nextCursor ? "Showing " + count + " so far" : "";
      if (!count) {
        $("mine-msg").className = "muted";
        $("mine-msg").textContent = "No bookings for that email.";
        $("mine-table").classList.add("hide");
      } else {
        clearNote("mine-msg");
        $("mine-table").classList.remove("hide");
      }
    }).catch(function () {
      $("more").disabled = false;
      note("mine-msg", "bad", "Could not reach the server.");
    });
  }

  function appendMine(items) {
    var body = $("mine-body");
    items.forEach(function (b) {
      var row = document.createElement("tr");
      var cancellable = b.status === "confirmed";
      row.innerHTML =
        '<td class="mono">' + esc(b.id.slice(0, 8)) + "…</td>" +
        '<td class="hide-sm mono">' + esc(b.slot_id) + "</td>" +
        "<td>" + esc(fmt(b.created_at)) + "</td>" +
        "<td><span class=\"tag " + (cancellable ? "free" : "past") + '">' + esc(b.status) + "</span></td>" +
        '<td class="actions">' +
          (cancellable ? '<button class="ghost" data-cancel="' + esc(b.id) + '">Cancel</button>' : "") +
        "</td>";
      body.appendChild(row);
    });

    body.querySelectorAll("button[data-cancel]").forEach(function (button) {
      if (button.dataset.wired) { return; }
      button.dataset.wired = "1";
      button.addEventListener("click", function () {
        button.disabled = true;
        call("DELETE", "/bookings/" + encodeURIComponent(button.getAttribute("data-cancel")))
          .then(function (result) {
            if (!result.ok) {
              note("mine-msg", "bad", esc(result.data.error || "Could not cancel."));
              button.disabled = false;
              return;
            }
            loadMine(true);
            loadSlots();
          })
          .catch(function () {
            button.disabled = false;
            note("mine-msg", "bad", "Could not reach the server.");
          });
      });
    });
  }

  // ---- wiring ---------------------------------------------------------- //

  $("refresh").addEventListener("click", loadSlots);
  $("filter-provider").addEventListener("keydown", function (e) {
    if (e.key === "Enter") { loadSlots(); }
  });
  $("confirm").addEventListener("click", confirmBooking);
  $("cancel-booking-form").addEventListener("click", closeBookingForm);
  $("book-email").addEventListener("keydown", function (e) {
    if (e.key === "Enter") { confirmBooking(); }
  });
  $("lookup").addEventListener("click", function () { loadMine(true); });
  $("lookup-email").addEventListener("keydown", function (e) {
    if (e.key === "Enter") { loadMine(true); }
  });
  $("more").addEventListener("click", function () { loadMine(false); });

  loadSlots();
})();
</script>
</body>
</html>
