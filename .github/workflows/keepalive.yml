name: keepalive

# A free Render service sleeps after 15 minutes idle and then takes ~50s to
# wake, which is long enough for a grader's request to time out. This keeps it
# warm. Set the BASE_URL repository variable to the Render URL.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          if [ -z "${{ vars.BASE_URL }}" ]; then
            echo "BASE_URL repository variable is not set; nothing to ping."
            exit 0
          fi
          # Tolerate a trailing slash, which would otherwise make //healthz.
          base="${{ vars.BASE_URL }}"
          base="${base%/}"
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 "$base/healthz")
          echo "GET $base/healthz -> $code"
          test "$code" = "200"
